# Hotel PMS - Production Docker Compose
# Separate from ECODATA/ECONAI projects

version: '3.8'

services:
  # PostgreSQL Database (Port 5434 to avoid conflict)
  hotel-postgres:
    image: postgres:15-alpine
    container_name: hotel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hotel_pms
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-HotelPMS2026@Secure}
    volumes:
      - hotel_postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - hotel-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U hotel_user -d hotel_pms" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Port 8002 to avoid conflict with ECODATA)
  hotel-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-backend
    restart: unless-stopped
    depends_on:
      hotel-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hotel_user:${POSTGRES_PASSWORD:-HotelPMS2026@Secure}@hotel-postgres:5432/hotel_pms
      ENV: production
      API_PREFIX: /api/v1
    ports:
      - "8002:8002"
    volumes:
      - hotel_uploads:/app/uploads
      - hotel_passport_uploads:/app/passport_uploads
    networks:
      - hotel-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend (Port 8003 to avoid conflict)
  hotel-frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: hotel-frontend
    restart: unless-stopped
    depends_on:
      - hotel-backend
    ports:
      - "8003:80"
    networks:
      - hotel-network

networks:
  hotel-network:
    name: hotel-network
    driver: bridge

volumes:
  hotel_postgres_data:
    name: hotel_postgres_data
  hotel_uploads:
    name: hotel_uploads
  hotel_passport_uploads:
    name: hotel_passport_uploads
